[workspace]
members = [
    "server",
    "client"
    "client",
    "testing_startup"
]
resolver = "2"

[workspace.package]
authors = ["Jesse Greenough"]
description = "Real-Time Chatting Application"


[workspace.dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.40.0"

