[workspace]
members = [
    "server",
    "client",
    "app_startup",
    "testing_startup",
    "crates/shared"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["GreenJ84"]
description = "Real-Time Chatting Application"


[workspace.dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.40.0"

