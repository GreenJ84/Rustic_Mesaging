[package]
name = "client"
version = "0.1.0"
edition = "2021"
authors = ["Jesse Greenough"]
description = "Real-Time Chatting Application"

[dependencies]
# Client(DOM)
yew = { version = "0.21.0", git = "https://github.com/yewstack/yew/", features = ["csr"] }
yew-router = { version = "0.18.0", git = "https://github.com/yewstack/yew.git" }
gloo = "0.11.0"
# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.43"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "ScrollBoxObject", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "DomTokenList", "ScrollBehavior"] }
# Utility
rand = "0.9.0-alpha.2"
chrono = { version = "*", features = ["serde"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
urlencoding = "2.1.3"
wasm-logger = "0.2.0"
log = "0.4.22"
dotenv = "0.15.0"

