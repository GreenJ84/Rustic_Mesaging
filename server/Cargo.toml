[package]
name = "server"
edition = "2021"
version.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
# Server
rocket = { version = "0.5.1", features = ["json", "serde_json"] }
rocket_cors = "0.6.0"
ws = { package = "rocket_ws", version = "0.1.1" }

base64 = "0.21.0"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
csv = "1.3.0"

# Database connection
diesel = { version = "2.2.4", features = [
    "postgres",
    "r2d2",
    "numeric",
    "uuid",
    "chrono",
] }
r2d2 = "0.8"

argon2 = "0.5.3"
blake3 = "1.5"
jsonwebtoken = "9.3.0"

chrono = { version = "*", features = ["serde"] }
dotenv = "0.15.0"
log = "0.4.8"
rand = "0.8.5"
tokio = "*"
urlencoding = "2.1.3"
uuid = { version = "1.27", features = ["v7", "serde", "fast-rng"] }

[lib]
name = "rustic_messaging"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"
