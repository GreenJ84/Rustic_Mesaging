version: '3'
services:
  yugabyte:
    image: yugabytedb/yugabyte:2024.1.2.0-b77
    container_name: yugabyte
    expose:
      - "7001"
      - "9000"
      - "15433"
      - "5433"
      - "9042"
    command: [ "bin/yugabyted", "start", "--background=false" ]
    restart: unless-stopped
    volumes:
      - data:/data
    networks:
      - backend

  server:
    container_name: server
    build: ./server
    expose:
      - "8000"
    env_file:
      - "server/.env"
      - "server/.env.prod"
    networks:
      - frontend
      - backend
    depends_on:
      - yugabyte
    command: > 
      sh -c "
        until pg_isready -h yugabyte -p 5433; do
          echo 'Waiting for YugabyteDB...'; sleep 5;
        done;
        diesel database reset && diesel migration run;
        ./server;
      "

  client:
    container_name: client
    build: ./client
    ports:
      - "80:80"
    networks:
      - frontend
    depends_on:
      - server
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data