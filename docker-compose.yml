version: '3'
services:
  yugabyte:
    image: yugabytedb/yugabyte:2024.1.2.0-b77
    container_name: yugabyte
    ports:
      - "7001:7000"     # YugabyteDB master web UI
      - "9000:9000"     # YugabyteDB YSQL API
      - "15433:15433"   # Postgres compatible port
      - "5433:5433"     # YSQL client port
      - "9042:9042"     # YCQL client port
#    healthcheck:
#      test: [ "CMD-SHELL", "pg_isready -h localhost -p 5433" ]
#      interval: 10s
#      timeout: 5s
#      retries: 5
    command: [ "bin/yugabyted", "start", "--background=false" ]
    restart: unless-stopped
    volumes:
      - data:/data
    networks:
      - backend

  server:
    container_name: server
    build: ./server
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - "server/.env"
      - "server/.env.prod"
    networks:
      - frontend
      - backend
    depends_on:
      - yugabyte
    command: > 
      sh -c "
        until pg_isready -h yugabyte -p 5433; do
          echo 'Waiting for YugabyteDB...'; sleep 5;
        done;
        diesel database reset && diesel migration run;
        ./server;
      "

  client:
    container_name: client
    build: ./client
    ports:
      - "3000:80"
    networks:
      - frontend
    depends_on:
      - server
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data